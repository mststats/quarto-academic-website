project:
  type: website
  output-dir: docs
    
# Meta
description-meta: "Quarto Academic Website of Michael Salter-Townshend"
author-meta: "Dr. Michael Salter-Townshend"

website:
  title: "Home"
  description: "Michael Salter-Townshend website"
 
  navbar:
    background: light  # You can change the background color here
    left:   # You can comment out all navigation items here if you just like to keep the index page only
#      - text: Home
#        href: index.qmd
      - text: Publications 
        menu:
          - text: Publications  # Manually curated list of publications
            href: publications.qmd            
          - text: All Publications # Automatically generated from publications.bib
            href: pub-listing.qmd
      - text: Projects
        href: projects.qmd
      - text: Software
        href: software.qmd
      - text: Teaching 
        href: teaching.qmd
      - text: Activities
        href: activities.qmd
      - text: Group   
        href: people.qmd
      - text: News
        href: posts.qmd

    right: 
      - text: CV
        href: files/MST_cv.pdf
      - text: "{{< fa brands bluesky >}}"
        href: https://bsky.app/profile/mststats.bsky.social
        target: _blank      
  
  page-navigation: true
  
  page-footer: 
    left: "[Michael Salter-Townshend](http://maths.ucd.ie/~mst) &copy; <script>document.write(new Date().getFullYear())</script>" 
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true

  draft-mode: unlinked
  
  repo-url: https://github.com/mststats/quarto-academic-website-template
#  repo-actions: [edit, issue, source]
  
  open-graph: true
  
  twitter-card: true 
#  card-style: summary      
  
  site-url: "https://mststats.github.io/quarto-academic-website-template"
  
  google-analytics:
    tracking-id: ""  # Please delete or replace with your own tracking ID
    anonymize-ip: true 

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/mststats\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"

